<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TabCrew</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>TabCrew</h1>
      <span id="status" class="status offline">…</span>
    </header>

    <p id="pairing-note" class="note" hidden></p>

    <section>
      <fieldset id="placement">
        <legend>New agent tabs open in:</legend>
        <label class="radio"><input type="radio" name="placement" value="own_window" checked /> Their own window (fastest)</label>
        <label class="radio"><input type="radio" name="placement" value="user_window" /> My current window</label>
        <p class="note radio-note">Slower: Chrome throttles tabs you aren't looking at. Agents never switch your current tab.</p>
      </fieldset>
    </section>

    <section>
      <div class="row spread">
        <h2>Sessions</h2>
        <button id="stop-all" class="danger">Stop all</button>
      </div>
      <ul id="sessions"></ul>
      <p id="stop-note" class="note"></p>
    </section>

    <section id="finished-section" hidden>
      <div class="row spread">
        <h2>Finished</h2>
        <button id="close-all-finished" title="Close the tabs of every finished session">Close all finished</button>
      </div>
      <ul id="finished"></ul>
      <p id="finished-note" class="note"></p>
    </section>

    <details>
      <summary>Advanced</summary>
      <label for="token">Daemon token (set automatically by pairing)</label>
      <div class="row">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="paste token" />
        <button id="save-token">Save</button>
      </div>
      <p id="token-note" class="note"></p>
      <label for="port">Daemon port</label>
      <div class="row">
        <input id="port" type="number" min="1" max="65535" />
        <button id="save-port">Save</button>
      </div>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
