<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChromeUse v2</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>ChromeUse v2</h1>
      <span id="status" class="status offline">…</span>
    </header>

    <section>
      <label for="token">Daemon token</label>
      <div class="row">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="paste token" />
        <button id="save-token">Save</button>
      </div>
      <p id="token-note" class="note"></p>
    </section>

    <section>
      <div class="row spread">
        <h2>Sessions</h2>
        <button id="stop-all" class="danger">Stop all</button>
      </div>
      <ul id="sessions"></ul>
      <p id="stop-note" class="note"></p>
    </section>

    <section id="finished-section" hidden>
      <div class="row spread">
        <h2>Finished</h2>
        <button id="close-all-finished" title="Close the tabs of every finished session">Close all finished</button>
      </div>
      <ul id="finished"></ul>
      <p id="finished-note" class="note"></p>
    </section>

    <details>
      <summary>Advanced</summary>
      <label for="port">Daemon port</label>
      <div class="row">
        <input id="port" type="number" min="1" max="65535" />
        <button id="save-port">Save</button>
      </div>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
