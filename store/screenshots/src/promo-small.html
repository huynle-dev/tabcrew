<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      body.promo {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 34px;
        gap: 0;
        background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 45%, #0f766e 100%);
        color: #fff;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .top img {
        width: 72px;
        height: 72px;
        background: #fff;
        border-radius: 18px;
        padding: 8px;
      }
      .top h1 {
        margin: 0;
        font-size: 40px;
        letter-spacing: -0.5px;
      }
      p {
        margin: 18px 0 0;
        font-size: 19px;
        line-height: 1.35;
        color: #ede9fe;
      }
    </style>
  </head>
  <body class="promo">
    <div class="top">
      <img src="../../../extension/assets/icon-128.png" alt="" />
      <h1>TabCrew</h1>
    </div>
    <p>Give each AI agent its own tabs in your browser. You stay in control.</p>
  </body>
</html>
