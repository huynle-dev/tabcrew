name: Release

# Runs when a version tag is pushed (git tag v0.4.0 && git push --tags):
# verifies the build, publishes the `tabcrew` CLI to npm (with provenance) and creates a GitHub
# release with the Chrome Web Store zip attached. Uploading the zip to the store stays manual
# (see store/SUBMIT.md).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches every version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json cli/package.json daemon/package.json extension/package.json shared/package.json extension/manifest.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error file=$f::version $v does not match tag $GITHUB_REF_NAME (run node scripts/bump-version.mjs $tag)"
              exit 1
            fi
          done
          echo "All versions are $tag"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build and check the store package
        run: npm run build:store

      - name: Check the CLI package contents
        run: npm pack --dry-run -w tabcrew

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Publish tabcrew to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish. Add it under Settings → Secrets and variables → Actions, then re-run this job."
            exit 0
          fi
          if npm view "tabcrew@$version" version >/dev/null 2>&1; then
            echo "tabcrew@$version is already on npm; skipping publish."
            exit 0
          fi
          npm publish -w tabcrew --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="extension/tabcrew-extension-$version.zip"
          test -f "$zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --verify-tag \
              --title "TabCrew $version" \
              --generate-notes
          fi
