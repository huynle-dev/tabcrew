name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build and check the store package (no key, no source maps, no eval)
        run: npm run build:store

      - name: Check the CLI package contents
        run: npm pack --dry-run -w tabcrew

      - name: Check scripts parse
        run: for f in daemon/scripts/*.mjs cli/build.mjs extension/scripts/*.mjs store/scripts/*.mjs scripts/*.mjs; do node --check "$f"; done

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
