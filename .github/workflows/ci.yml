name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build store package
        run: npm run build:store -w extension

      - name: Check store manifest has no key
        run: node -e 'const m=require("./extension/dist-store/manifest.json"); if ("key" in m) process.exit(1)'

      - name: Check the CLI package contents
        run: npm pack --dry-run -w tabcrew

      - name: Check scripts parse
        run: for f in daemon/scripts/*.mjs cli/build.mjs; do node --check "$f"; done

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
